# Minimal conda env: just Python + pip. Everything else (torch cu126, boltz fork,
# pinned deps) is installed by cluster/setup.sh because torch needs a custom pip index.
# Create with:  bash cluster/setup.sh     (do not run `conda env create` directly,
# it would put the env and caches in $HOME)
name: boltz2-bayes
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
